<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta

    >

    <title>Cupons da Moin ❤️</title>

    <link
        rel="stylesheet"
        href="cupons.css"
    >

</head>

<body>

    <div class="decor decor-1">✦</div>
    <div class="decor decor-2">♡</div>

    <div class="decor decor-4">♡</div>


    <!-- Conteúdo principal -->
    <main class="cupons">


        <!-- =====================================
             PILHA DE POLAROIDS
        ====================================== -->

        <div class="polaroids-area">

            <div class="polaroid polaroid-1">

                <img
                    src="imagens/foto1.jpg"

                >

            </div>


            <div class="polaroid polaroid-2">

                <img
                    src="imagens/foto2.jpg"
                    alt="Foto da Moin 2"
                >

            </div>


            <div class="polaroid polaroid-3">

                <img
                    src="imagens/foto3.jpg"
                    alt="Foto da Moin 3"
                >

            </div>


            <div class="polaroid polaroid-4">

                <img

            </div>


            <div class="polaroid polaroid-5">

                <img
                    src="imagens/foto5.jpg"
                    alt="Foto da Moin 5"
                >

            </div>

        </div>


        <!-- =====================================
             TÍTULO DOS CUPONS
        ====================================== -->

        <p class="mini-titulo">
            UM PRESENTINHO PARA VOCÊ
        </p>


        <h1>
            Cupons da Moin
        </h1>


        <p class="subtitulo">
            porque alguns presentes podem ser usados

        </p>

             IMAGEM DOS CUPONS
        ====================================== -->

        <div class="imagem-cupons">

            <img
                src="imagens/cupons.jpg"
                alt="Cupons especiais para a Moin"
            >

        </div>


        <!-- =====================================
             BOTÃO VOLTAR
        ====================================== -->

        <a
            href="index.html"
            class="voltar"

    <div class="coracao coracao-1">
        ♡
    </div>

    <div class="coracao coracao-2">

    <div class="coracao coracao-3">
        ♡
    </div>

</html>
